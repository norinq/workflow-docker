name: BuildImage
on:
  workflow_call:
    inputs:
      source_tag:
        description: Git tag or branch to check out
        required: true
        type: string
        default: ''
      build-args:
        description: Multiline build arguments for docker/build-push-action
        required: true
        type: string
        default: ''
      metadata_tags:
        description: Multiline tag rules for docker/metadata-action
        required: true
        type: string

permissions:
  actions: write
  packages: write
  contents: read

jobs:
  build:
    name: BuildImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_tag }}
          fetch-depth: 0
      - name: Get repo name
        id: repo_name
        run: |
          set -e -o pipefail
          repo_name="${GITHUB_REPOSITORY##*/}"
          if [ -z "$repo_name" ]; then
            echo "ERROR: Unable to determine repository name from GITHUB_REPOSITORY ${GITHUB_REPOSITORY}" >&2
            exit 1
          fi
          echo "repo_name=${repo_name}" >> $GITHUB_OUTPUT
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: |
            ghcr.io/${{ github.repository }}
          tags: ${{ inputs.metadata_tags }}
          labels: |
            org.opencontainers.image.title=${{ steps.repo_name.outputs.repo_name }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./image
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64,linux/arm
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: ${{ inputs.build-args }}
